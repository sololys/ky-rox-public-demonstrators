name: Public surface gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify bounded public tree
        run: python3 tools/verify_public_surface.py
